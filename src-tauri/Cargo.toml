[package]
name = "rdblog-explorer"
version = "0.1.0"
description = "RDB Log Explorer — Sales Transaction Explorer"
authors = ["ElvisPOS"]
license = "ISC"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
# Cross-platform SIGINT/SIGTERM handling so the bundled sidecar is always torn
# down on Ctrl-C (dev) as well as on a normal window-close quit.
ctrlc = { version = "3", features = ["termination"] }
